name: merge_pdf
description: "Merge, split and rotate PDFs."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  easy_localization: ^3.0.8
  file_picker: ^13.0.0
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  flutter_riverpod: ^3.1.0
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  get_it: ^9.2.0
  go_router: ^18.0.1
  hooks_riverpod: ^3.1.0
  injectable: ^2.7.1+4
  material_ui: ^1.4.0
  objectbox: ^5.2.0
  objectbox_flutter_libs: any
  open_filex: ^5.0.0
  path_provider: ^2.1.5
  pdf_manipulator: ^5.0.1
  riverpod_annotation: ^4.0.0
  sizer: ^3.1.3

dev_dependencies:
  build_runner: ^2.11.0
  flutter_test:
    sdk: flutter
  freezed: ^3.1.0
  go_router_builder: ^4.0.1
  injectable_generator: ^2.7.0
  json_serializable: ^6.9.5
  objectbox_generator: any
  riverpod_generator: ^4.0.0+1
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/all.csv

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
